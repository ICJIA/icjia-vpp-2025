<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Debug Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Search Debug Tool</h1>
        
        <div class="section info">
            <h3>Search Test</h3>
            <input type="text" id="searchInput" placeholder="Enter search term" value="Rex adipiscing">
            <button onclick="testSearch()">Test Search</button>
            <div id="searchResults"></div>
        </div>

        <div class="section" id="configSection">
            <h3>📋 Configuration Status</h3>
            <div id="configStatus">Loading...</div>
        </div>

        <div class="section" id="indexSection">
            <h3>📊 Search Index Status</h3>
            <div id="indexStatus">Loading...</div>
        </div>

        <div class="section" id="fuseSection">
            <h3>🔍 Fuse.js Test</h3>
            <div id="fuseStatus">Not tested yet</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
    <script>
        let searchIndex = null;
        let fuseConfig = null;
        let fuseInstance = null;

        // Load and test configuration
        async function loadConfig() {
            try {
                const response = await fetch('/config/fuse.config.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                fuseConfig = await response.json();
                document.getElementById('configStatus').innerHTML = `
                    <div class="success">
                        <strong>✅ Configuration loaded successfully</strong><br>
                        <strong>Content weight:</strong> ${fuseConfig.search.fuseOptions.keys.find(k => k.name === 'content')?.weight || 'Not found'}<br>
                        <strong>Title weight:</strong> ${fuseConfig.search.fuseOptions.keys.find(k => k.name === 'title')?.weight || 'Not found'}<br>
                        <strong>Threshold:</strong> ${fuseConfig.search.fuseOptions.threshold}<br>
                        <strong>Min term length:</strong> ${fuseConfig.search.minTermLength}
                    </div>
                `;
                return true;
            } catch (error) {
                document.getElementById('configStatus').innerHTML = `
                    <div class="error">
                        <strong>❌ Failed to load configuration</strong><br>
                        Error: ${error.message}
                    </div>
                `;
                return false;
            }
        }

        // Load and test search index
        async function loadSearchIndex() {
            try {
                const response = await fetch('/data/search-index.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                searchIndex = await response.json();
                
                // Find homepage entry
                const homepage = searchIndex.find(item => item.path === '/' || item.path === '/index');
                const hasRexAdipiscing = homepage ? homepage.content.includes('Rex adipiscing') : false;
                
                document.getElementById('indexStatus').innerHTML = `
                    <div class="success">
                        <strong>✅ Search index loaded successfully</strong><br>
                        <strong>Total items:</strong> ${searchIndex.length}<br>
                        <strong>Homepage found:</strong> ${homepage ? '✅ Yes' : '❌ No'}<br>
                        <strong>Contains "Rex adipiscing":</strong> ${hasRexAdipiscing ? '✅ Yes' : '❌ No'}<br>
                        ${homepage ? `<strong>Homepage title:</strong> "${homepage.title}"<br>` : ''}
                        ${homepage ? `<strong>Content preview:</strong> "${homepage.content.substring(0, 100)}..."` : ''}
                    </div>
                `;
                return true;
            } catch (error) {
                document.getElementById('indexStatus').innerHTML = `
                    <div class="error">
                        <strong>❌ Failed to load search index</strong><br>
                        Error: ${error.message}
                    </div>
                `;
                return false;
            }
        }

        // Test search functionality
        async function testSearch() {
            const query = document.getElementById('searchInput').value;
            
            if (!searchIndex || !fuseConfig) {
                document.getElementById('searchResults').innerHTML = `
                    <div class="error">❌ Search index or config not loaded</div>
                `;
                return;
            }

            try {
                // Create Fuse instance if not exists
                if (!fuseInstance) {
                    fuseInstance = new Fuse(searchIndex, fuseConfig.search.fuseOptions);
                }

                // Perform search
                const results = fuseInstance.search(query);
                
                document.getElementById('fuseStatus').innerHTML = `
                    <div class="success">
                        <strong>✅ Fuse.js search completed</strong><br>
                        <strong>Query:</strong> "${query}"<br>
                        <strong>Results found:</strong> ${results.length}<br>
                        ${results.length > 0 ? `<strong>Top result:</strong> "${results[0].item.title}" (${results[0].item.path}) - Score: ${results[0].score.toFixed(3)}` : ''}
                    </div>
                `;

                // Display results
                if (results.length > 0) {
                    const resultsList = results.slice(0, 3).map((result, index) => 
                        `${index + 1}. <strong>"${result.item.title}"</strong> (${result.item.path}) - Score: ${result.score.toFixed(3)}`
                    ).join('<br>');
                    
                    document.getElementById('searchResults').innerHTML = `
                        <div class="success">
                            <strong>✅ Found ${results.length} result(s):</strong><br>
                            ${resultsList}
                        </div>
                    `;
                } else {
                    document.getElementById('searchResults').innerHTML = `
                        <div class="error">
                            <strong>❌ No results found for "${query}"</strong><br>
                            This suggests a configuration or indexing issue.
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('searchResults').innerHTML = `
                    <div class="error">
                        <strong>❌ Search failed</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Initialize on page load
        window.addEventListener('load', async () => {
            await loadConfig();
            await loadSearchIndex();
        });
    </script>
</body>
</html>
