      ogTitle: "Guiding Principles - Violence Prevention Plan for Illinois: 2025-2029"
      ogDescription: Five foundational principles that guide all violence prevention efforts in Illinois.
      ogImage: /images/og-image-principles.jpg
      twitterCard: summary_large_image
      showTOC: true
    body: The five guiding principles of the 2020-2024 Violence Prevention Plan informed the updated plan goals and
      recommendations.## Foster belonging and social connectednessIndividuals, families, and communities can find
      acceptance and develop resiliency through healthy, peaceful relationships. Violence prevention programming can
      include relational opportunities based on developmental stages and risk factors.## Advance equityViolence
      prevention programming can address inequities by partnering with individuals, families and communities who
      experience a disproportionate amount of risk factors. State agencies can address historical inequities by
      embedding communities' true voice in the decision-making processes.## Promote SafetyThe ability to live without
      fear of harm is a fundamental human right and developmentally essential to individual, familial and community
      success. Violence prevention programming cannot only attempt to stop violence but also strive to develop
      culturally responsive, safe, and peaceful environments.## Support healthViolence prevention programming can build
      and sustain mentally and physically strong individuals, families, and communities. These trauma informed practices
      include policies and efforts that support staff in local organizations.## Engage state agencies in
      collaborationViolence prevention programming takes place across many state agencies and are often focused on
      similar outcomes. We can work more effectively by communicating across agencies at least quarterly in which
      sharing resources, best practices and data is the norm. This coordination results in efficiency for funded
      agencies and improved outcomes for individuals, families, and communities in Illinois.
