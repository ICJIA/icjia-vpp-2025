    body: >-
      In preparation for the 2025-2029 Violence Prevention Plan, several groups were convened to review data and
      research, hear updates on violence prevention efforts across the state, review previous recommendations, and
      contribute feedback. The goals and recommendations in this plan are a result of this collaborative effort.##
      Planning ProcessResearch and data analyses took place throughout the 2020-2024 plan period. An overview of this
      research can be found in "2020-2024 Research Summary Report." Research and reports were shared with the Violence
      Prevention Ad Hoc Committee in Fall 2021 to Summer 2024.Three workgroups were formed:

      - A data workgroup was formed to review the updated violence rates and trends report that was released, ensuring
      the new plan was reflective of these data.

      - A grant implementation workgroup was formed to review the focus group and interview results from ICJIA violence
      prevention grantees and grant monitors. This workgroup focused on the goal related to equity in grant
      implementation.

      - A recommendations workgroup was formed to review the 2020-2024 goals and recommendations, while considering new
      recommendations from the data and grant implementation workgroups.The 2025-2029 Statewide Violence Prevention Plan
      goals and recommendations are reflective of committee and workgroup members' feedback and suggestions.## Violence
      Prevention Ad Hoc Committee MeetingsAfter the 2020-2024 Statewide Violence Prevention Plan was released, the
      Violence Prevention Ad Hoc Committee was formed and it held 13 quarterly meetings. These meetings included data
      and research presentations, ICJIA and community program updates, and discussions about writing the 2025-2029
      Violence Prevention Plan. Meetings were held on the following dates:- **2021:** August 2 and November 4, 2021

      - **2022:** February 10, June 9, September 8, and November 10, 2022

      - **2023:** February 23, May 11, August 10, and November 9, 2023

      - **2024:** February 8, May 9, and August 8, 2024## Data Workgroup MeetingsThis workgroup was formed to review
      updated violence data and trends. This workgroup met to ensure the new plan included the most up-to-date data.
      Meetings were held on:

      - February 22 and March 21, 2024## Grant Implementation Workgroup MeetingsThis workgroup assembled to review data
      from ICJIA grant staff interviews and violence prevention grantee focus groups. The group met to ensure the plan
      incorporated grant implementation goals and recommendations with up-to-date feedback. Meetings were held on:

      - March 21 and May 23, 2024## Recommendations Workgroup MeetingsThis workgroup formed to review previous
      recommendations and to modify and propose new goals and recommendations. Meetings were held on:

      - March 28 and May 23, 2024
