<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A" />
      <stop offset="100%" style="stop-color:#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93C5FD" />
      <stop offset="100%" style="stop-color:#67E8F9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle geometric accents -->
  <circle cx="1050" cy="110" r="280" fill="#1E293B" opacity="0.4"/>
  <circle cx="1100" cy="80" r="180" fill="#1E293B" opacity="0.3"/>
  <circle cx="150" cy="550" r="200" fill="#1E293B" opacity="0.25"/>

  <!-- ICJIA label -->
  <text x="600" y="115" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="15" font-weight="500" fill="#93C5FD" letter-spacing="0.15em" text-anchor="middle">
    ILLINOIS CRIMINAL JUSTICE INFORMATION AUTHORITY
  </text>

  <!-- Accent line under label -->
  <rect x="570" y="133" width="60" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Main title line 1 -->
  <text x="600" y="225" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="62" font-weight="700" fill="#F1F5F9" letter-spacing="-0.02em" text-anchor="middle">
    Violence Prevention
  </text>

  <!-- Main title line 2 -->
  <text x="600" y="297" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="62" font-weight="700" fill="#F1F5F9" letter-spacing="-0.02em" text-anchor="middle">
    Plan for Illinois
  </text>

  <!-- Year badge -->
  <text x="600" y="375" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="46" font-weight="600" fill="#93C5FD" letter-spacing="0.04em" text-anchor="middle">
    2025–2029
  </text>

  <!-- Tagline -->
  <text x="600" y="435" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="19" font-weight="400" fill="#F1F5F9" opacity="0.55" text-anchor="middle">
    Building safer communities through evidence-based strategies
  </text>

  <!-- Bottom domain -->
  <text x="600" y="580" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="16" font-weight="400" fill="#F1F5F9" opacity="0.35" text-anchor="middle">
    vpp.icjia.illinois.gov
  </text>
</svg>
