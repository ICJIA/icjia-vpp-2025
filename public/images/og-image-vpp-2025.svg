<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b3d91;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#90caf9;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative geometric shapes -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGradient)" opacity="0.2"/>
  <circle cx="1100" cy="530" r="180" fill="url(#accentGradient)" opacity="0.2"/>

  <!-- Illinois outline (simplified) -->
  <g transform="translate(900, 200)" opacity="0.15">
    <path d="M 50,0 L 60,10 L 70,50 L 75,100 L 70,150 L 60,200 L 50,210 L 40,200 L 30,150 L 25,100 L 30,50 L 40,10 Z"
          fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Main content container -->
  <g id="content">
    <!-- ICJIA Attribution -->
    <text x="600" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.9">
      Illinois Criminal Justice Information Authority
    </text>

    <!-- Main title -->
    <text x="600" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
      Violence Prevention Plan
    </text>

    <!-- Subtitle -->
    <text x="600" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">
      for Illinois
    </text>

    <!-- Decorative line -->
    <line x1="400" y1="360" x2="800" y2="360" stroke="#90caf9" stroke-width="4" opacity="0.8"/>

    <!-- Year range -->
    <text x="600" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="64" font-weight="700" fill="#64b5f6" text-anchor="middle" letter-spacing="4">
      2025–2029
    </text>

    <!-- Bottom tagline -->
    <text x="600" y="540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.85">
      Building Safer Communities Through Evidence-Based Strategies
    </text>
  </g>

  <!-- Accent border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#64b5f6" stroke-width="8" opacity="0.3"/>
</svg>
