<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Subtle radial glow mimicking dark mode ambient light -->
    <radialGradient id="glow" cx="30%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background: dark mode background color -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <!-- Subtle ambient glow -->
  <rect width="1200" height="630" fill="url(#glow)" opacity="0.5"/>

  <!-- App bar simulation -->
  <rect x="0" y="0" width="1200" height="56" fill="#1A2234"/>
  <!-- App bar bottom edge -->
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#1E293B" stroke-width="1"/>

  <!-- App bar text/logo placeholder -->
  <text x="80" y="37" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="18" font-weight="500" fill="#F1F5F9" letter-spacing="0.02em">
    Violence Prevention Plan for Illinois
  </text>

  <!-- Nav items in app bar (right side) -->
  <text x="750" y="37" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="14" font-weight="400" fill="#93C5FD" opacity="0.85">
    Read the Plan
  </text>
  <text x="900" y="37" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="14" font-weight="400" fill="#F1F5F9" opacity="0.6">
    Resources
  </text>
  <text x="1010" y="37" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="14" font-weight="400" fill="#F1F5F9" opacity="0.6">
    Search
  </text>
  <!-- Theme toggle icon placeholder -->
  <circle cx="1130" cy="30" r="10" fill="none" stroke="#F1F5F9" stroke-width="1.5" opacity="0.4"/>

  <!-- Main content area -->
  <g id="hero-content" transform="translate(80, 120)">

    <!-- Hero title: matching HomeHero two-color pattern -->
    <text x="0" y="55" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="42" font-weight="600" fill="#93C5FD" letter-spacing="-0.02em">
      Statewide Violence
    </text>
    <text x="0" y="107" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="42" font-weight="600" fill="#93C5FD" letter-spacing="-0.02em">
      Prevention Plan
    </text>

    <!-- "for Illinois: 2025-2029" in on-surface text color -->
    <text x="0" y="159" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="42" font-weight="600" fill="#F1F5F9" letter-spacing="-0.02em">
      for Illinois: 2025–2029
    </text>

    <!-- Hero description paragraph (mimicking the hero description text) -->
    <text x="0" y="215" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="17" font-weight="400" fill="#F1F5F9" opacity="0.7">
      Violence is a global public health crisis. The Illinois
    </text>
    <text x="0" y="240" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="17" font-weight="400" fill="#F1F5F9" opacity="0.7">
      Criminal Justice Information Authority aims to continue
    </text>
    <text x="0" y="265" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="17" font-weight="400" fill="#F1F5F9" opacity="0.7">
      funding and supporting violence prevention efforts
    </text>
    <text x="0" y="290" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="17" font-weight="400" fill="#F1F5F9" opacity="0.7">
      across Illinois.
    </text>

    <!-- CTA buttons mimicking hero buttons -->
    <!-- Download button (flat primary) -->
    <rect x="0" y="325" width="170" height="46" rx="23" ry="23" fill="#93C5FD"/>
    <text x="85" y="354" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="16" font-weight="500" fill="#0F172A" text-anchor="middle" letter-spacing="0.02em">
      Download
    </text>

    <!-- Learn More button (outlined primary) -->
    <rect x="195" y="325" width="170" height="46" rx="23" ry="23"
          fill="none" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="280" y="354" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="16" font-weight="500" fill="#93C5FD" text-anchor="middle" letter-spacing="0.02em">
      Learn More
    </text>
  </g>

  <!-- Right side: surface card placeholder mimicking the hero cover image -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="400" height="440" rx="8" ry="8" fill="#1E293B"/>
    <!-- Inner content area to suggest the VPP cover -->
    <rect x="20" y="20" width="360" height="400" rx="4" ry="4" fill="#0F172A" opacity="0.6"/>

    <!-- Simulated cover content -->
    <text x="200" y="110" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="16" font-weight="600" fill="#93C5FD" text-anchor="middle" opacity="0.9">
      STATEWIDE
    </text>
    <text x="200" y="145" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#F1F5F9" text-anchor="middle">
      Violence Prevention
    </text>
    <text x="200" y="175" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#F1F5F9" text-anchor="middle">
      Plan for Illinois
    </text>

    <!-- Decorative line on cover -->
    <line x1="80" y1="200" x2="320" y2="200" stroke="#93C5FD" stroke-width="2" opacity="0.5"/>

    <text x="200" y="235" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="28" font-weight="700" fill="#67E8F9" text-anchor="middle" letter-spacing="2">
      2025–2029
    </text>

    <!-- ICJIA attribution on cover -->
    <text x="200" y="350" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="11" font-weight="400" fill="#F1F5F9" text-anchor="middle" opacity="0.5">
      Illinois Criminal Justice
    </text>
    <text x="200" y="368" font-family="Roboto, 'Segoe UI', sans-serif"
          font-size="11" font-weight="400" fill="#F1F5F9" text-anchor="middle" opacity="0.5">
      Information Authority
    </text>
  </g>

  <!-- Bottom bar: subtle ICJIA branding -->
  <rect x="0" y="590" width="1200" height="40" fill="#1A2234" opacity="0.6"/>
  <text x="80" y="616" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" fill="#F1F5F9" opacity="0.45">
    Illinois Criminal Justice Information Authority
  </text>
  <text x="1120" y="616" font-family="Roboto, 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" fill="#F1F5F9" opacity="0.45" text-anchor="end">
    vpp.icjia.illinois.gov
  </text>
</svg>
