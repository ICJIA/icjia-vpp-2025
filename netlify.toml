# Netlify configuration — Astro build
# Violence Prevention Plan for Illinois: 2025-2029
#
# The app lives in astro/. Security headers, cache policy, and the
# /sitemap.xml 200-rewrite ship WITH the build in astro/public/_headers
# and astro/public/_redirects (they end up in astro/dist and are read from
# the publish dir). Keeping them in-app — rather than in this file — avoids
# the netlify.toml-overrides-_headers precedence trap and keeps the policy
# colocated with the code it secures.

[build]
  base = "astro/"
  command = "pnpm install && pnpm build"
  # publish is resolved RELATIVE TO base ("astro/"), so this is astro/dist.
  # Do NOT write "astro/dist" — base would double it to astro/astro/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.33.0"

# Canonicalize the Netlify default subdomain to the custom domain (production).
# Does not match branch-deploy subdomains, so it's inert on previews.
[[redirects]]
  from = "https://vpp-2025.netlify.app/*"
  to = "https://vpp.icjia.illinois.gov/:splat"
  status = 301
  force = true

# NOTE: app-level routing/headers live with the build, not here:
#   - /plan → /plan/front-cover/   → astro/src/pages/plan/index.astro (301)
#   - /sitemap.xml → /sitemap-0.xml → astro/public/_redirects (200)
#   - CSP + security + cache headers → astro/public/_headers
#   - 404 → astro/dist/404.html (Netlify serves it automatically)
