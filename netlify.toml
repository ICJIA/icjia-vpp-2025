# Netlify Configuration for Violence Prevention Plan for Illinois: 2025-2029
# This file configures build settings and deployment options for Netlify

[build]
# Build command with native module rebuild
command = "yarn install && yarn check-sass && yarn rebuild-sqlite && yarn run generate"

# Directory to publish (Nuxt 3 generates to dist by default)
publish = "dist"

[build.environment]
# Node.js version for build environment
NODE_VERSION = "20"

# Ensure native modules can be built properly
NPM_FLAGS = "--production=false"

# Set build environment variables
NODE_ENV = "production"

# Force use of modern Sass instead of node-sass
SASS_IMPLEMENTATION = "sass"

# Enable verbose logging for debugging
DEBUG = "nuxt:*"

# Headers for security and performance
[[headers]]
for = "/*"
[headers.values]
# Security headers
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Performance headers
Cache-Control = "public, max-age=31536000, immutable"

# Special headers for HTML files
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Special headers for API and data files
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "public, max-age=300"

[[headers]]
for = "/*.json"
[headers.values]
Cache-Control = "public, max-age=300"

[[headers]]
for = "/*.yaml"
[headers.values]
Cache-Control = "public, max-age=300"

[[headers]]
for = "/*.csv"
[headers.values]
Cache-Control = "public, max-age=300"

# Redirects
[[redirects]]
from = "/plan"
to = "/plan/front-cover"
status = 301

# Error pages
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
